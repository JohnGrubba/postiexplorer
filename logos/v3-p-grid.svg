<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="v3-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="v3-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#v3-bg)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <!-- P built from grid cells -->
  <g>
    <rect x="62" y="46" width="38" height="38" rx="11" fill="url(#v3-grad)"/>
    <rect x="110" y="46" width="38" height="38" rx="11" fill="url(#v3-grad)" opacity="0.92"/>
    <rect x="158" y="46" width="38" height="38" rx="11" fill="#8b5cf6"/>
    <rect x="62" y="94" width="38" height="38" rx="11" fill="url(#v3-grad)" opacity="0.95"/>
    <rect x="158" y="94" width="38" height="38" rx="11" fill="#8b5cf6" opacity="0.85"/>
    <rect x="62" y="142" width="38" height="38" rx="11" fill="url(#v3-grad)" opacity="0.9"/>
    <rect x="110" y="142" width="38" height="38" rx="11" fill="url(#v3-grad)" opacity="0.75"/>
    <rect x="158" y="142" width="38" height="38" rx="11" fill="#8b5cf6" opacity="0.65"/>
    <rect x="62" y="190" width="38" height="16" rx="8" fill="#22d3ee" opacity="0.55"/>
    <!-- table-grid negative space in top bowl of P -->
    <rect x="110" y="94" width="38" height="38" rx="11" fill="#070b14" opacity="0.85"/>
    <line x1="110" y1="113" x2="148" y2="113" stroke="#22d3ee" stroke-width="4" opacity="0.8"/>
    <line x1="129" y1="94" x2="129" y2="132" stroke="#22d3ee" stroke-width="4" opacity="0.5"/>
  </g>
  <!-- explorer cursor dot -->
  <circle cx="186" cy="196" r="17" fill="url(#v3-grad)" stroke="#070b14" stroke-width="6"/>
  <circle cx="186" cy="196" r="5" fill="#ffffff"/>
