# Local PostgreSQL for development + backend verification.
# One command:  docker compose up -d
# Then:         npm run test:db   (runs Rust integration tests in src-tauri/tests/live_db.rs)
# Seed data:    ./seed.sql is applied automatically on first start.
services:
  postgres:
    image: postgres:16
    container_name: postiexplorer-pg
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
