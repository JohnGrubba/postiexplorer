name: Feature request
description: Small, well-scoped ideas that fit the single-binary core
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? UI sketch or example SQL welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Explorer / data grid
        - SQL editor
        - Connection handling / TLS
        - Backend (Rust)
        - Build / CI / releases
        - Docs
  - type: checkboxes
    id: contrib
    attributes:
      label: Contribution
      options:
        - label: I can open a PR for this (see CONTRIBUTING.md)
