# Builds PostiExplorer on Windows, Linux and macOS and publishes the
# bundles from ./releases/ as CI artifacts (and as a rolling GitHub
# Release tagged `latest` on every push to main — no manual tags needed).
#
# Path-filtered (see `on.push/pull_request.paths`): docs, screenshots and
# other non-build files don't trigger the runners. Use "Run workflow"
# (workflow_dispatch) to force a build anyway.
#
# Live-DB verification: the ubuntu job starts postgres:16 as a service,
# seeds demo_db with seed.sql and runs the Rust integration tests
# (src-tauri/tests/live_db.rs) before building.

name: build

on:
  push:
    branches: [main]
    # Only run the expensive multi-OS build when files that actually feed
    # into it changed. Docs, screenshots, licenses etc. must not burn
    # three runners + a rolling release. `workflow_dispatch` below is
    # unaffected and always allows a manual run.
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - 'seed.sql'
      - 'docker-compose.yml'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - 'seed.sql'
      - 'docker-compose.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  # ── Linux x64: test against real Postgres, then build ──
  build-linux:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Seed demo_db
        run: |
          psql "host=localhost user=postgres password=postgres" -f seed.sql
        env:
          PGPASSWORD: postgres

      - name: System deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev build-essential curl wget file

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npx tsc --noEmit

      # The Tauri binary embeds ../dist at COMPILE time (generate_context!),
      # and `cargo test` also compiles the binary — so the frontend must be
      # built before any cargo command. Otherwise you get:
      #   "frontendDist ... but this path doesn't exist".
      - run: npm run build

      - name: Backend tests (live Postgres)
        run: cargo test --test live_db --manifest-path src-tauri/Cargo.toml
        env:
          PG_HOST: localhost
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DB: demo_db

      # appimage + deb only: rpm bundling needs rpmbuild, absent on ubuntu runners.
      - run: npm run dist -- --bundles appimage deb

      - uses: actions/upload-artifact@v4
        with:
          name: postiexplorer-linux
          path: releases/

  # ── Windows x64 ──
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run dist -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: postiexplorer-windows-x64
          path: releases/

  # ── Windows ARM64 (Snapdragon / Surface Pro X and newer) ──
  # Runs natively on a windows-11-arm runner, so the Rust toolchain targets
  # aarch64-pc-windows-msvc by default — no extra target setup needed.
  # Installer-only: the raw portable binary is skipped (SKIP_PORTABLE=1)
  # because it would collide with the x64 `postiexplorer.exe` asset name
  # in the flat GitHub Release namespace.
  build-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run dist -- --bundles nsis
        env:
          SKIP_PORTABLE: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: postiexplorer-windows-arm64
          path: releases/

  # ── macOS arm64 (M1+, macos-latest) ──
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run dist -- --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: postiexplorer-macos
          path: releases/

  # ── Publish installers as a rolling GitHub Release on every push to main ──
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-linux, build-windows-x64, build-windows-arm64, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PostiExplorer latest (main)
          body: |
            Auto-built from `main` — no manual tags needed.

            Commit: ${{ github.sha }}
            Run: #${{ github.run_number }}
          files: artifacts/**/*
          make_latest: true
          generate_release_notes: true
          prerelease: false
