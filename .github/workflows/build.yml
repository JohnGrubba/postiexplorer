# Builds PostiExplorer on Windows, Linux and macOS and publishes the
# bundles from ./releases/ as CI artifacts (and as a GitHub Release on tags).
#
# Live-DB verification: the ubuntu job starts postgres:16 as a service,
# seeds demo_db with seed.sql and runs the Rust integration tests
# (src-tauri/tests/live_db.rs) before building.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # ── Linux x64: test against real Postgres, then build ──
  build-linux:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Seed demo_db
        run: |
          psql "host=localhost user=postgres password=postgres" -f seed.sql
        env:
          PGPASSWORD: postgres

      - name: System deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev build-essential curl wget file

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npx tsc --noEmit

      - name: Backend tests (live Postgres)
        run: cargo test --test live_db --manifest-path src-tauri/Cargo.toml
        env:
          PG_HOST: localhost
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DB: demo_db

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: postiexplorer-linux
          path: releases/

  # ── Windows x64 ──
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run dist -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: postiexplorer-windows
          path: releases/

  # ── macOS arm64 (M1+, macos-latest) ──
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run dist -- --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: postiexplorer-macos
          path: releases/

  # ── Publish installers as a GitHub Release on version tags ──
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
